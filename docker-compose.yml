services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: riskradar
      POSTGRES_PASSWORD: riskradar
      POSTGRES_DB: riskradar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://riskradar:riskradar@db:5432/riskradar
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://frontend:5173
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    depends_on:
      - db
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://localhost:8000
      VITE_WS_BASE: ws://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
